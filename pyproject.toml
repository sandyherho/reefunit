[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reefunit"
version = "0.1.0"
description = "Wave-driven sliding, ratcheting and overturning of coral transplant units"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Sandy H. S. Herho" },
    { name = "Iwan P. Anwar" },
    { name = "Alfita P. Handayani" },
    { name = "Faruq Khadami" },
    { name = "Karina A. Sujatmiko" },
    { name = "Dasapta E. Irawan" }
]
keywords = ["coral restoration", "transplant unit", "nonsmooth dynamics",
            "rocking block", "internal solitary wave", "Indonesia"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "numba>=0.58",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["reefunit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
